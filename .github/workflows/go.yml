name: Go

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.22.x
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Build and Lint
      run: |
         go build ./...
         go vet -tests=false ./... # Specifically for examples without a corresponding identifier
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.22.x
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Test on ${{ matrix.os }}
      run: go test ./...
  fips140:
    name: 'Test FIPS 140'
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.22.x
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Test
      run: GODEBUG=fips140=on go test ./...
